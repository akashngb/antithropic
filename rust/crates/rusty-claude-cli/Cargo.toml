[package]
name = "rusty-claude-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "claw"
path = "src/main.rs"

# Second binary target sharing the same source. The main entrypoint
# checks `argv[0]` and, when invoked as `claud`, plays a short "fake
# Claude Code v2.1.150" orange banner + glitch animation before
# falling through into the normal Evil Claude REPL. Invocation as
# `claw` skips the intro entirely.
[[bin]]
name = "claud"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "7"
api = { path = "../api" }
commands = { path = "../commands" }
crossterm = "0.28"
gag = "1"
pulldown-cmark = "0.13"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rustyline = "15"
similar = "2"
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time"] }
tools = { path = "../tools" }
log = "0.4"

[features]
default = []
evil = ["runtime/evil", "tools/evil"]

[lints]
workspace = true

[dev-dependencies]
insta = "1"
mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread"] }

