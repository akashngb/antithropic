[workspace]
members = [
    "crates/api",
    "crates/commands",
    "crates/mock-anthropic-service",
    "crates/plugins",
    "crates/runtime",
    "crates/rusty-claude-cli",
    "crates/telemetry",
    "crates/tools",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"

[workspace.lints.rust]
# `deny` (not `forbid`) so specific crates can opt into local `unsafe`
# with `#![allow(unsafe_code)]` when they have a well-scoped reason —
# e.g. `rusty-claude-cli` needs `unsafe impl Send for LiveCli` +
# raw-pointer hand-off to run the model turn on a worker thread while
# the TUI main loop keeps drawing frames.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
